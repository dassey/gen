    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .section {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ff69b4;
        }
        .item {
            margin-bottom: 10px;
        }
        .toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        .toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #ff69b4;
        }
        .label {
            font-size: 14px;
        }
        select {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px;
            width: 100%;
            font-size: 14px;
        }
        select:disabled {
            background-color: #222;
            color: #666;
        }
        input[type="text"] {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px;
            width: 100%;
            font-size: 14px;
        }
        .button-group {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .generate-btn, .randomize-btn, .clear-btn {
            background: linear-gradient(45deg, #ff69b4, #00f5ff);
            border: none;
            color: #fff;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .generate-btn:hover, .randomize-btn:hover, .clear-btn:hover {
            transform: scale(1.05);
        }
        .clear-btn {
             background: linear-gradient(45deg, #888, #444);
        }
        .output-section {
            grid-column: 1 / -1;
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
        }
        .output-text {
            width: 100%;
            min-height: 100px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
        }
        .copy-btn {
            background-color: #555;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background-color: #666;
        }
        .header {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            font-weight: 600;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
    </style>
</head>

                if (targetSelect) {

        document.getElementById('pose-category').addEventListener('change', updatePoseOptions);

        // Set initial state
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
                const targetSelect = document.getElementById(checkbox.id.replace('-toggle', '-select'));
                if (targetSelect) {
                    targetSelect.disabled = true;
                }
            });
            document.getElementById('hairstyle-style').disabled = true;
            document.getElementById('clothing-category').disabled = true;
            document.getElementById('jacket-select').disabled = true;
            document.getElementById('pants-select').disabled = true;
            document.getElementById('shoes-select').disabled = true;
            document.getElementById('top-select').disabled = true;
            document.getElementById('outfits-category').disabled = true;
            document.getElementById('outfits-select').disabled = true;
            document.getElementById('pose-category').disabled = true;
            document.getElementById('pose-select').disabled = true;

            updateClothingOptions();
            updateOutfitsOptions();
            updatePoseOptions();
        });


        function generatePrompt() {
            let parts = [];
            const name = document.getElementById('name-input').value.trim();
            if (name) {
                parts.push(name);
            }
            parts.push('woman');

            // Basic Info
            if (document.getElementById('age-toggle').checked) {
                const age = document.getElementById('age-select').value;
                if (age) parts.push(age);
            }
            if (document.getElementById('ethnicity-toggle').checked) {
                const ethnicity = document.getElementById('ethnicity-select').value;
                if (ethnicity) parts.push('of ' + ethnicity.toLowerCase() + ' descent');
            }
            if (document.getElementById('profession-toggle').checked) {
                const profession = document.getElementById('profession-select').value;
                if (profession) parts.push('dressed as ' + profession.toLowerCase());
            }


            // Appearance
            if (document.getElementById('skin-toggle').checked) {
                const skin = document.getElementById('skin-select').value;
                if (skin) parts.push('with ' + skin);
            }
            if (document.getElementById('body-toggle').checked) {
                const body = document.getElementById('body-select').value;
                if (body) parts.push('with ' + body);
            }
            if (document.getElementById('breast-toggle').checked) {
                const breast = document.getElementById('breast-select').value;
                if (breast) parts.push('with ' + breast);
            }
            if (document.getElementById('face-toggle').checked) {
                const face = document.getElementById('face-select').value;
                if (face) parts.push('with ' + face);
            }
            if (document.getElementById('eye-toggle').checked) {
                const eye = document.getElementById('eye-select').value;
                if (eye) parts.push('with ' + eye + ' eyes');
            }

            // Hairstyle and Hair
            if (document.getElementById('hairstyle-toggle').checked) {
                const style = document.getElementById('hairstyle-style').value;
                if (style) {
                    parts.push('with a ' + style + ' haircut');
                }
            }
            if (document.getElementById('hair-toggle').checked) {
                const hair = document.getElementById('hair-select').value;
                if (hair) parts.push('with ' + hair + ' hair');
            }

            // Makeup and Expression
            if (document.getElementById('makeup-toggle').checked) {
                const makeup = document.getElementById('makeup-select').value;
                if (makeup) parts.push('wearing ' + makeup);
            }
            if (document.getElementById('expression-toggle').checked) {
                const expr = document.getElementById('expression-select').value;
                if (expr) parts.push('with a ' + expr);
            }

            // Clothing
            if (document.getElementById('clothing-toggle').checked) {
                const cat = document.getElementById('clothing-category').value;
                if (cat) {
                    let clothingList = [];
                    ['jacket', 'top', 'shoes', 'pants'].forEach(type => {
                        const val = document.getElementById(type + '-select').value;
                        if (val && val !== 'None') clothingList.push(val);
                    });
                    if (clothingList.length > 0) {
                        parts.push('wearing ' + clothingList.join(', '));
                    }
                }
            }
            // Outfits
            if (document.getElementById('outfits-toggle').checked) {
                const outfits = document.getElementById('outfits-select').value;
                if (outfits) parts.push(outfits);
            }

            // Accessories
            if (document.getElementById('accessories-toggle').checked) {
                const acc = document.getElementById('accessories-select').value;
                if (acc) parts.push('wearing ' + acc);
            }
            if (document.getElementById('food-toggle').checked) {
                const food = document.getElementById('food-select').value;
                if (food) parts.push(food);
            }
            if (document.getElementById('props-toggle').checked) {
                const props = document.getElementById('props-select').value;
                if (props) parts.push(props);
            }
            // Pose
            if (document.getElementById('pose-toggle').checked) {
                const pose = document.getElementById('pose-select').value;
                if (pose) parts.push(pose);
            }

            // Camera
            if (document.getElementById('camera-toggle').checked) {
                const cam = document.getElementById('camera-select').value;
                if (cam) parts.push(cam);
            }

            // Environment
            if (document.getElementById('env-toggle').checked) {
                const env = document.getElementById('env-select').value;
                if (env) parts.push(env);
            }

            // Lighting
            if (document.getElementById('light-toggle').checked) {
                const light = document.getElementById('light-select').value;
                if (light) parts.push('with ' + light);
            }
            
            // Image Style
            if (document.getElementById('style-toggle').checked) {
                const style = document.getElementById('style-select').value;
                if (style) parts.push(style);
            }
            
            document.getElementById('output-text').value = parts.join(', ');
        }


        function copyToClipboard() {
            const text = document.getElementById('output-text');
            text.select();
            document.execCommand('copy');
        }

        function randomizePrompt() {
            // Uncheck all checkboxes first and disable all selects
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
                const changeEvent = new Event('change');
                checkbox.dispatchEvent(changeEvent);
            });

            // List of all sections and their corresponding selects
            const sections = [
                { id: 'age-toggle', selects: ['age-select'] },
                { id: 'ethnicity-toggle', selects: ['ethnicity-select'] },
                { id: 'profession-toggle', selects: ['profession-select'] },
                { id: 'skin-toggle', selects: ['skin-select'] },
                { id: 'body-toggle', selects: ['body-select'] },
                { id: 'breast-toggle', selects: ['breast-select'] },
                { id: 'face-toggle', selects: ['face-select'] },
                { id: 'eye-toggle', selects: ['eye-select'] },
                { id: 'hairstyle-toggle', selects: ['hairstyle-style'] },
                { id: 'hair-toggle', selects: ['hair-select'] },
                { id: 'makeup-toggle', selects: ['makeup-select'] },
                { id: 'expression-toggle', selects: ['expression-select'] },
                { id: 'clothing-toggle', selects: ['clothing-category', 'jacket-select', 'pants-select', 'shoes-select', 'top-select'] },
                { id: 'accessories-toggle', selects: ['accessories-select'] },
                { id: 'food-toggle', selects: ['food-select'] },
                { id: 'props-toggle', selects: ['props-select'] },
                { id: 'pose-toggle', selects: ['outfits-category', 'outfits-select'] },
                { id: 'pose-toggle', selects: ['pose-category', 'pose-select'] },
                { id: 'camera-toggle', selects: ['camera-select'] },
                { id: 'env-toggle', selects: ['env-select'] },
                { id: 'light-toggle', selects: ['light-select'] },
                { id: 'style-toggle', selects: ['style-select'] }
            ];

            // Iterate through each section and decide if it should be randomized
            sections.forEach(section => {
                // 50% chance to enable the section
                if (Math.random() > 0.5) {
                    const checkbox = document.getElementById(section.id);
                    checkbox.checked = true;

                    // Trigger change event to enable the corresponding selects
                    const changeEvent = new Event('change');
                    checkbox.dispatchEvent(changeEvent);

                    // Now, randomize the options in the enabled selects
                    section.selects.forEach(selectId => {
                        const select = document.getElementById(selectId);
                        if (select) {
                            if (selectId === 'clothing-category') {
                                // Select a random clothing category first
                                const options = Array.from(select.options).slice(1); // Exclude "Category"
                                const randomOption = options[Math.floor(Math.random() * options.length)];
                                select.value = randomOption.value;
                                updateClothingOptions(); // Call to populate the other clothing selects
                            } else if (selectId === 'pose-category') {
                                // Select a random pose category first
                                const options = Array.from(select.options).slice(1); // Exclude "Category"
                                const randomOption = options[Math.floor(Math.random() * options.length)];
                                select.value = randomOption.value;
                                updatePoseOptions(); // Call to populate the pose select
                            } else {
                                // All other selects
                                const options = Array.from(select.options);
                                let startIndex = 1; // Exclude the first option (placeholder)
                                // For clothing items, also include the "None" option
                                if (['jacket-select', 'pants-select', 'shoes-select', 'top-select'].includes(selectId)) {
                                    startIndex = 1; // "None" is the second option at index 1
                                }

                                const randomOptionIndex = Math.floor(Math.random() * (options.length - startIndex)) + startIndex;
                                select.value = options[randomOptionIndex].value;
                            }
                        }
                    });
                }
            });

            // Generate the prompt after randomization
            generatePrompt();
        }

        function clearAll() {
            // Uncheck all checkboxes
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
                const changeEvent = new Event('change');
                checkbox.dispatchEvent(changeEvent);
            });

            // Clear input field and output textarea
            document.getElementById('name-input').value = '';
            document.getElementById('output-text').value = '';
        }
    </script>
